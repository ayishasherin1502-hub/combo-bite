        { id: "c7", userName: "Kerala Police Cybercell", userAvatar: "👮", content: "Please stay right where you are. A team has been dispatched to your location.", createdAt: "1 day ago", likes: 154 }
      ]
    };

    const INITIAL_USERS = [
      { id: "user-1", name: "Rahul Kumar", handle: "@rahulkerala", avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80", role: "Kerala Food Purist", combosAdded: 4, combosRated: 18, favorites: ["puttu-kadala", "porotta-beef-fry", "pazham-pori-beef"], badges: ["combo_hunter", "food_explorer"] },
      { id: "user-2", name: "Maya Shenoy", handle: "@mayabites", avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=200&q=80", role: "Culinary Adventurer", combosAdded: 6, combosRated: 26, favorites: ["pazham-pori-beef", "puttu-ice-cream"], badges: ["combo_hunter", "food_explorer", "cursed_scientist"] },
      { id: "user-3", name: "Appu The Sinner", handle: "@appu_chaos", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80", role: "Cursed Food Scientist 💀", combosAdded: 7, combosRated: 35, favorites: ["biriyani-ketchup", "pizza-gulab-jamun", "maggi-curd"], badges: ["combo_hunter", "cursed_scientist", "no_fear"] }
    ];

    const BADGE_DEFINITIONS = {
      combo_hunter: { id: "combo_hunter", name: "Combo Hunter", emoji: "🏆", description: "Rated 10 or more food combinations" },
      food_explorer: { id: "food_explorer", name: "Food Explorer", emoji: "🔥", description: "Explored and interacted with 20+ food combinations" },
      cursed_scientist: { id: "cursed_scientist", name: "Cursed Food Scientist", emoji: "💀", description: "Submitted or favored 3+ cursed food combinations" },
      no_fear: { id: "no_fear", name: "No Fear", emoji: "🤯", description: "Rated 3 or more combinations with weirdness above 4" }
    };

    const CATEGORIES = [
      { id: "all", name: "All Combos", icon: "✨" },
      { id: "kerala", name: "Kerala Specials", icon: "🌴" },
      { id: "breakfast", name: "Breakfast", icon: "🥞" },
      { id: "meat", name: "Meat & Poultry", icon: "🥩" },
      { id: "seafood", name: "Seafood", icon: "🐟" },
      { id: "rice", name: "Rice & Grains", icon: "🍚" },
      { id: "snacks", name: "Snacks & Tea", icon: "🍟" },
      { id: "desserts", name: "Desserts & Sweet", icon: "🍰" },
      { id: "cursed", name: "Cursed Vault 💀", icon: "💀" }
    ];

    // --- CONTEXT ---
    const AppContext = createContext();

    function AppProvider({ children }) {
      const [combinations, setCombinations] = useState(() => {
        try {
          const s = localStorage.getItem('combobite_combos_s');
          return s ? JSON.parse(s) : INITIAL_COMBINATIONS;
        } catch(e) { return INITIAL_COMBINATIONS; }
      });
      const [comments, setComments] = useState(() => {
        try {
          const s = localStorage.getItem('combobite_comments_s');
          return s ? JSON.parse(s) : INITIAL_COMMENTS;
        } catch(e) { return INITIAL_COMMENTS; }
      });
      const [users, setUsers] = useState(() => {
        try {
          const s = localStorage.getItem('combobite_users_s');
          return s ? JSON.parse(s) : INITIAL_USERS;
        } catch(e) { return INITIAL_USERS; }
      });
      const [currentUserId, setCurrentUserId] = useState('user-1');
      const [userRatings, setUserRatings] = useState(() => {
        try {
          const s = localStorage.getItem('combobite_ratings_s');
          return s ? JSON.parse(s) : {};
        } catch(e) { return {}; }
      });
      const [duelVotes, setDuelVotes] = useState({});
      const [currentTab, setCurrentTab] = useState('explore');
      const [selectedComboId, setSelectedComboId] = useState(null);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [toasts, setToasts] = useState([]);

      useEffect(() => {
        try { localStorage.setItem('combobite_combos_s', JSON.stringify(combinations)); } catch(e){}
      }, [combinations]);

      useEffect(() => {
        try { localStorage.setItem('combobite_comments_s', JSON.stringify(comments)); } catch(e){}
      }, [comments]);

      useEffect(() => {
        try { localStorage.setItem('combobite_users_s', JSON.stringify(users)); } catch(e){}
      }, [users]);

      useEffect(() => {
        try { localStorage.setItem('combobite_ratings_s', JSON.stringify(userRatings)); } catch(e){}
      }, [userRatings]);

      const currentUser = users.find(u => u.id === currentUserId) || users[0];

      const addToast = (title, message, type = 'info', emoji = '✨') => {
        const id = Date.now() + Math.random();
        setToasts(prev => [...prev.slice(-3), { id, title, message, type, emoji }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4500);
      };

      const removeToast = (id) => setToasts(prev => prev.filter(t => t.id !== id));

      const toggleFavorite = (comboId) => {
        const isFav = currentUser.favorites.includes(comboId);
        const updated = isFav ? currentUser.favorites.filter(id => id !== comboId) : [...currentUser.favorites, comboId];
        setUsers(prev => prev.map(u => u.id === currentUser.id ? { ...u, favorites: updated } : u));
        if (!isFav) addToast('Saved to Favorites ❤️', 'Added to your bookmarked collection!', 'success', '❤️');
      };

      const submitRating = (comboId, stars, reaction = 'amazing') => {
        const combo = combinations.find(c => c.id === comboId);
        if (!combo) return;
        const userKey = currentUser.id;
        const existing = userRatings[userKey]?.[comboId];

        let newCount = combo.ratingCount;
        let newTotal = combo.ratingAvg * combo.ratingCount;
        if (existing) {
          newTotal = newTotal - existing.stars + stars;
        } else {
          newCount += 1;
          newTotal += stars;
        }
        const newAvg = Number((newTotal / newCount).toFixed(2));

        const updatedReactions = { ...combo.reactions };
        if (existing && existing.reaction) {
          updatedReactions[existing.reaction] = Math.max(0, (updatedReactions[existing.reaction] || 1) - 1);
        }
        updatedReactions[reaction] = (updatedReactions[reaction] || 0) + 1;

        setCombinations(prev => prev.map(c => c.id === comboId ? { ...c, ratingAvg: newAvg, ratingCount: newCount, reactions: updatedReactions } : c));
        const updatedRatings = { ...userRatings, [userKey]: { ...(userRatings[userKey] || {}), [comboId]: { stars, reaction } } };
        setUserRatings(updatedRatings);

        const updatedUser = { ...currentUser, combosRated: Object.keys(updatedRatings[userKey] || {}).length };
        setUsers(prev => prev.map(u => u.id === currentUser.id ? updatedUser : u));

        if (window.confetti && stars === 5) {
          try { window.confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } }); } catch(e){}
        }

        // Contextual toast responses
        if (combo.weirdnessScore >= 4 && stars >= 4) {
          addToast('Interesting choice... 👀', `You gave ${stars}★ to "${combo.title}". Are you okay?`, 'cursed', '💀');
        } else if (combo.isKeralaSpecial && stars <= 2) {
          addToast('Blasphemy detected! 🚨', `You just judged someone's childhood comfort food (${combo.title}) 💀`, 'cursed', '😭');
        } else if (stars === 5) {
          addToast('A person of refined culture! 🤌', `You rated "${combo.title}" 5/5. Immaculate taste.`, 'success', '🤌');
        } else {
          addToast('Rating saved!', `Your ${stars}★ vote on "${combo.title}" has been recorded.`, 'info', '⭐');
        }
      };

      const voteDuel = (comboId, choice) => {
        const combo = combinations.find(c => c.id === comboId);
        if (!combo) return;
        const prevVote = duelVotes[currentUser.id]?.[comboId];
        if (prevVote === choice) return;

        let normDelta = 0; let cursDelta = 0;
        if (choice === 'normal') {
          normDelta = 1; if (prevVote === 'cursed') cursDelta = -1;
        } else {
          cursDelta = 1; if (prevVote === 'normal') normDelta = -1;
        }

        setCombinations(prev => prev.map(c => c.id === comboId ? {
          ...c,
          votesNormal: Math.max(0, (c.votesNormal || 0) + normDelta),
          votesCursed: Math.max(0, (c.votesCursed || 0) + cursDelta)
        } : c));

        setDuelVotes(prev => ({
          ...prev,
          [currentUser.id]: { ...(prev[currentUser.id] || {}), [comboId]: choice }
        }));

        if (choice === 'cursed') {
          addToast('Voted CURSED 💀', 'Added to the hall of infamy!', 'cursed', '💀');
        } else {
          addToast('Voted NORMAL 🤌', 'Sanity prevails!', 'success', '🤌');
        }
      };

      const addComment = (comboId, content) => {
        if (!content.trim()) return;
        const newC = {
          id: 'c_' + Date.now(),
          userName: currentUser.name,
          userAvatar: currentUser.name.charAt(0),
          content: content.trim(),
          createdAt: 'Just now',
          likes: 0
        };
        setComments(prev => ({ ...prev, [comboId]: [newC, ...(prev[comboId] || [])] }));
        addToast('Comment Posted 💬', 'Your hot take has been published!', 'info', '💬');
      };

      const likeComment = (comboId, commentId) => {
        setComments(prev => ({
          ...prev,
          [comboId]: (prev[comboId] || []).map(c => c.id === commentId ? { ...c, likes: c.likes + 1 } : c)
        }));
      };

      const addCombination = (data) => {
        const id = (data.mainFoodName + '-' + data.comboFoodName).toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + Date.now().toString().slice(-4);
        const newCombo = {
          id,
          title: data.title || `${data.mainFoodName} + ${data.comboFoodName}`,
          mainFoodId: 'custom',
          mainFoodName: data.mainFoodName,
          comboFoodName: data.comboFoodName,
          category: data.category || 'Kerala Specials',
          imageUrl: data.imageUrl || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=1000&q=80',
          description: data.description || `Pairing of ${data.mainFoodName} and ${data.comboFoodName}.`,
          whyLike: data.whyLike || 'Adventurous tastebuds know no boundaries!',
          weirdnessScore: Number(data.weirdnessScore) || 2,
          ratingAvg: 5.0,
          ratingCount: 1,
          reactions: { amazing: 1, good: 0, okay: 0, weird: 0, cursed: 0 },
          votesNormal: data.weirdnessScore <= 2 ? 1 : 0,
          votesCursed: data.weirdnessScore > 2 ? 1 : 0,
          isKeralaSpecial: Boolean(data.isKeralaSpecial),
          trending: true,
          createdBy: currentUser.name,
          createdAt: new Date().toISOString()
        };

        setCombinations(prev => [newCombo, ...prev]);
        setUsers(prev => prev.map(u => u.id === currentUser.id ? { ...u, combosAdded: (u.combosAdded || 0) + 1 } : u));
        addToast('Combo Published! 🎉', `"${newCombo.title}" is now live!`, 'success', '🚀');
        return newCombo;
      };

      const resetToDefaults = () => {
        localStorage.clear();
        setCombinations(INITIAL_COMBINATIONS);
        setComments(INITIAL_COMMENTS);
        setUsers(INITIAL_USERS);
        setUserRatings({});
        setDuelVotes({});
        addToast('Database Reset', 'Returned to original seed combinations.', 'info', '🔄');
      };

      const selectedCombo = combinations.find(c => c.id === selectedComboId) || null;

      return (
        <AppContext.Provider value={{
          combinations,
          comments,
          users,
          currentUser,
          setCurrentUserId,
          currentTab,
          setCurrentTab,
          selectedComboId,
          setSelectedComboId,
          selectedCombo,
          isAddModalOpen,
          setIsAddModalOpen,
          isProfileModalOpen,
          setIsProfileModalOpen,
          searchQuery,
          setSearchQuery,
          selectedCategory,
          setSelectedCategory,
          userRatings,
          duelVotes,
          toasts,
          addToast,
          removeToast,
          toggleFavorite,
          submitRating,
          voteDuel,
          addComment,
          likeComment,
          addCombination,
          resetToDefaults,
          BADGE_DEFINITIONS
        }}>
          {children}
        </AppContext.Provider>
      );
    }

    const useApp = () => useContext(AppContext);

    // --- TOAST CONTAINER ---
    function ToastContainer() {
      const { toasts, removeToast } = useApp();
      if (!toasts.length) return null;
      return (
        <div className="fixed bottom-6 right-6 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none">
          {toasts.map((toast) => {
            const isCursed = toast.type === 'cursed';
            const isSuccess = toast.type === 'success';
            let borderBg = 'bg-slate-900/95 text-white border-slate-700 shadow-xl';
            if (isCursed) borderBg = 'bg-rose-950/95 text-rose-100 border-rose-600 shadow-rose-900/40 shadow-2xl';
            if (isSuccess) borderBg = 'bg-emerald-950/95 text-emerald-100 border-emerald-600 shadow-emerald-900/40 shadow-xl';

            return (
              <div key={toast.id} className={`pointer-events-auto flex items-start gap-3 p-4 rounded-2xl border backdrop-blur-md transition-all ${borderBg}`}>
                <div className="text-2xl select-none shrink-0 pt-0.5">{toast.emoji}</div>
                <div className="flex-1 min-w-0">
                  <h4 className="font-bold text-sm tracking-wide">{toast.title}</h4>
                  <p className="text-xs opacity-90 mt-1 leading-relaxed">{toast.message}</p>
                </div>
                <button onClick={() => removeToast(toast.id)} className="text-white/60 hover:text-white p-1">
                  <Icons.X size={15} />
                </button>
              </div>
            );
          })}
        </div>
      );
    }

    // --- NORMAL OR CURSED DUEL ---
    function NormalOrCursedDuel({ isStandalone = false }) {
      const { combinations, currentUser, duelVotes, voteDuel, setSelectedComboId, addToast } = useApp();
      const candidateIds = ['puttu-ice-cream', 'pazham-pori-beef', 'biriyani-ketchup', 'puttu-banana', 'porotta-nutella', 'pizza-gulab-jamun', 'maggi-curd', 'kappa-meen-curry'];
      const [currentIndex, setCurrentIndex] = useState(0);

      const duelList = candidateIds.map(id => combinations.find(c => c.id === id)).filter(Boolean);
      const combo = duelList[currentIndex % duelList.length] || combinations[0];
      if (!combo) return null;

      const currentVote = duelVotes[currentUser.id]?.[combo.id];
      const totalVotes = (combo.votesNormal || 0) + (combo.votesCursed || 0);
      const normalPercent = totalVotes > 0 ? Math.round(((combo.votesNormal || 0) / totalVotes) * 100) : 50;
      const cursedPercent = 100 - normalPercent;

      const handleShare = () => {
        const text = `Normal or Cursed? 💀 "${combo.title}" on ComboBite! What do you think?`;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text);
          addToast('Copied to Clipboard!', 'Share this food debate with friends 🍿', 'info', '📋');
        }
      };

      return (
        <div className={`relative w-full ${isStandalone ? 'max-w-3xl mx-auto my-8' : 'my-8'}`}>
          <div className="relative overflow-hidden rounded-3xl bg-slate-900 border-2 border-slate-700/80 shadow-2xl p-6 sm:p-8">
            <div className="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
              <div className="flex items-center gap-3">
                <div className="p-2.5 rounded-2xl bg-gradient-to-tr from-rose-500 to-amber-500 text-white shadow-md">
                  <Icons.Swords size={22} />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h3 className="font-black text-lg sm:text-xl text-white">Normal or Cursed? ⚔️</h3>
                    <span className="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30">Arena</span>
                  </div>
                  <p className="text-xs text-slate-400">You decide: Is this soul food or a culinary crime?</p>
                </div>
              </div>

              <button
                onClick={() => setCurrentIndex(prev => prev + 1)}
                className="p-2 sm:px-3 sm:py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 text-xs font-semibold flex items-center gap-1.5"
              >
                <Icons.RefreshCw size={14} />
                <span className="hidden sm:inline">Next Pairing</span>
              </button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
              <div className="md:col-span-5 relative rounded-2xl overflow-hidden aspect-[4/3] bg-slate-800 border border-slate-700">
                <img src={combo.imageUrl} alt={combo.title} className="w-full h-full object-cover" />
                <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent" />
                <div className="absolute bottom-3 left-3 right-3 flex items-center justify-between text-xs text-white">
                  <span>{combo.ratingAvg} ★ ({combo.ratingCount} reviews)</span>
                  <button onClick={() => setSelectedComboId(combo.id)} className="underline text-amber-400 font-bold">Details →</button>
                </div>
              </div>

              <div className="md:col-span-7 flex flex-col justify-center space-y-4">
                <div>
                  <h2 className="text-2xl sm:text-3xl font-black text-white">{combo.title}</h2>
                  <p className="mt-2 text-xs sm:text-sm text-slate-300 italic bg-slate-800/40 p-3 rounded-xl border border-slate-800">"{combo.description}"</p>
                </div>

                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button
                    onClick={() => voteDuel(combo.id, 'normal')}
                    className={`flex flex-col items-center justify-center p-4 rounded-2xl border-2 transition-all ${
                      currentVote === 'normal'
                        ? 'bg-emerald-950/80 border-emerald-500 text-emerald-200 ring-2 ring-emerald-500/50'
                        : 'bg-slate-800/80 hover:bg-emerald-950/30 border-slate-700 text-slate-200 hover:text-emerald-300'
                    }`}
                  >
                    <div className="text-3xl mb-1">🤌</div>
                    <div className="font-black text-sm tracking-wide uppercase">NORMAL</div>
                    <div className="text-[11px] opacity-75">Soul Food / Valid</div>
                  </button>

                  <button
                    onClick={() => voteDuel(combo.id, 'cursed')}
                    className={`flex flex-col items-center justify-center p-4 rounded-2xl border-2 transition-all ${

          <section className="relative pt-8 pb-12 sm:pt-12 sm:pb-16 bg-gradient-to-b from-slate-900 via-slate-900 to-slate-950 border-b border-slate-800 text-center px-4">
            <div className="max-w-4xl mx-auto space-y-5">
              <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-slate-800 text-xs font-bold text-amber-300 border border-slate-700">
                <span>🌴 Kerala's Food Pairing & Debate Arena</span>
                <span className="text-slate-500">|</span>
                <span className="text-rose-400">Normal or Cursed? 💀</span>
              </div>
              <h1 className="text-4xl sm:text-6xl font-black text-white tracking-tight">
                What goes with what? <span className="text-orange-500">👀</span>
              </h1>
              <p className="text-sm sm:text-lg text-slate-300 max-w-2xl mx-auto">
                Discover food combinations people love, tolerate, or absolutely regret — from nostalgic <span className="text-amber-300 font-bold">Puttu + Kadala</span> to controversial <span className="text-rose-400 font-bold">Puttu + Ice Cream</span>.
              </p>

              <form onSubmit={(e) => { e.preventDefault(); if (searchQuery) setCurrentTab('search'); }} className="max-w-xl mx-auto flex gap-2 p-2 bg-slate-800/90 border border-slate-700 rounded-full">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search food e.g. Puttu, Porotta, Beef, Ice Cream..."
                  className="w-full bg-transparent px-4 text-white text-sm focus:outline-none placeholder-slate-400"
                />
                <button type="submit" className="px-5 py-2 rounded-full bg-orange-500 text-slate-950 font-bold text-xs shrink-0">
                  Search
                </button>
              </form>

              {/* Category pills */}
              <div className="flex items-center gap-2 overflow-x-auto pb-2 justify-start sm:justify-center scrollbar-none pt-2">
                {CATEGORIES.map(cat => (
                  <button
                    key={cat.id}
                    onClick={() => setSelectedCategory(cat.id)}
                    className={`px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-colors ${selectedCategory === cat.id ? 'bg-orange-500 text-slate-950' : 'bg-slate-800 text-slate-300 hover:text-white'}`}
                  >
                    <span>{cat.icon}</span> <span>{cat.name}</span>
                  </button>
                ))}
              </div>
            </div>
          </section>

          {/* Body */}
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-12 text-left">
            {selectedCategory === 'all' ? (
              <>
                <NormalOrCursedDuel />

                {/* Trending */}
                <section className="space-y-4">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                    <h2 className="text-xl font-black text-white flex items-center gap-2">
                      <Icons.Flame className="text-orange-500" />
                      <span>Trending Combos 🔥</span>
                    </h2>
                    <button onClick={() => setCurrentTab('search')} className="text-xs text-orange-400 font-bold">See all →</button>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    {trending.map(c => <ComboCard key={c.id} combo={c} />)}
                  </div>
                </section>

                {/* Kerala Specials */}
                <section className="p-6 sm:p-8 rounded-3xl bg-emerald-950/20 border border-emerald-900/40 space-y-4">
                  <div className="flex items-center justify-between border-b border-emerald-900/40 pb-3">
                    <h2 className="text-xl font-black text-white flex items-center gap-2">
                      <span>🌴</span>
                      <span>Kerala Comfort Specials</span>
                    </h2>
                    <span className="text-xs text-emerald-300 font-bold">God's Own Gastronomy</span>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    {keralaClassics.map(c => <ComboCard key={c.id} combo={c} />)}
                  </div>
                </section>

                {/* Cursed Vault */}
                <section className="p-6 sm:p-8 rounded-3xl bg-rose-950/20 border border-rose-900/40 space-y-4">
                  <div className="flex items-center justify-between border-b border-rose-900/40 pb-3">
                    <h2 className="text-xl font-black text-white flex items-center gap-2">
                      <span>💀</span>
                      <span>The Cursed Hall of Infamy</span>
                    </h2>
                    <button onClick={() => setCurrentTab('duel')} className="text-xs text-rose-400 font-bold">Vote in Arena →</button>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    {cursed.map(c => <ComboCard key={c.id} combo={c} />)}
                  </div>
                </section>
              </>
            ) : (
              <section className="space-y-4">
                <h2 className="text-2xl font-black text-white capitalize">Category: {selectedCategory}</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                  {displayCombos.map(c => <ComboCard key={c.id} combo={c} />)}
                </div>
              </section>
            )}
          </div>
        </div>
      );
    }

    // --- SEARCH DISCOVER VIEW ---
    function SearchDiscoverView() {
      const { combinations, searchQuery, setSearchQuery } = useApp();
      const [activeFood, setActiveFood] = useState(null);
      const [sortBy, setSortBy] = useState('highest_rated');

      const chips = ['Puttu', 'Porotta', 'Pazham Pori', 'Kappa', 'Biriyani', 'Appam', 'Kanji', 'Maggi', 'Ice Cream'];

      const results = useMemo(() => {
        let list = [...combinations];
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase().trim();
          list = list.filter(c => c.title.toLowerCase().includes(q) || c.mainFoodName.toLowerCase().includes(q) || c.comboFoodName.toLowerCase().includes(q));
        }
        if (activeFood) {
          const f = activeFood.toLowerCase();
          list = list.filter(c => c.mainFoodName.toLowerCase().includes(f) || c.comboFoodName.toLowerCase().includes(f));
        }
        if (sortBy === 'highest_rated') list.sort((a,b) => b.ratingAvg - a.ratingAvg);
        if (sortBy === 'weirdest') list.sort((a,b) => b.weirdnessScore - a.weirdnessScore);
        if (sortBy === 'popular') list.sort((a,b) => b.ratingCount - a.ratingCount);
        return list;
      }, [combinations, searchQuery, activeFood, sortBy]);

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6 text-left">
          <div className="space-y-3">
            <h1 className="text-2xl sm:text-3xl font-black text-white flex items-center gap-2">
              <Icons.Search className="text-orange-500" />
              <span>Search & Discover Combos</span>
            </h1>

            <div className="relative">
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search any food e.g. Puttu, Beef, Ice Cream..."
                className="w-full bg-slate-900 border border-slate-700 rounded-2xl px-12 py-3.5 text-white text-sm sm:text-base focus:outline-none focus:border-orange-500"
              />
              <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                <Icons.Search size={18} />
              </span>
            </div>

            <div className="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
              <span className="text-xs text-slate-400 font-bold shrink-0">Quick Filter:</span>
              {chips.map(chip => (
                <button
                  key={chip}
                  onClick={() => setActiveFood(activeFood === chip ? null : chip)}
                  className={`px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap ${activeFood === chip ? 'bg-amber-400 text-slate-950' : 'bg-slate-800 text-slate-300'}`}
                >
                  {chip}
                </button>
              ))}
            </div>
          </div>

          <div className="flex justify-between items-center text-xs text-slate-400">
            <span>Showing {results.length} combinations</span>
            <div className="flex items-center gap-2">
              <Icons.ArrowUpDown size={13} />
              <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="bg-slate-800 border border-slate-700 text-white rounded-lg p-1">
                <option value="highest_rated">⭐ Highest Rated</option>
                <option value="popular">🔥 Most Popular</option>
                <option value="weirdest">💀 Weirdest & Cursed</option>
              </select>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {results.map(c => <ComboCard key={c.id} combo={c} />)}
          </div>
        </div>
      );
    }

    // --- COMMUNITY FEED VIEW ---
    function CommunityFeedView() {
      const { combinations, currentUser, toggleFavorite, setSelectedComboId, comments, setIsAddModalOpen } = useApp();

      return (
        <div className="max-w-3xl mx-auto px-4 py-8 space-y-6 text-left">
          <div className="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
              <h1 className="text-2xl font-black text-white flex items-center gap-2">
                <Icons.Flame className="text-orange-500" />
                <span>Community Live Feed</span>
              </h1>
              <p className="text-xs text-slate-400">Latest combinations and reviews</p>
            </div>
            <button onClick={() => setIsAddModalOpen(true)} className="px-4 py-2 rounded-full bg-orange-500 text-slate-950 font-bold text-xs">
              + Post Combo
            </button>
          </div>

          <div className="space-y-6">
            {combinations.map((combo) => {
              const isFav = currentUser.favorites?.includes(combo.id);
              const comboComments = comments[combo.id] || [];
              return (
                <article key={combo.id} className="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden">
                  <div className="p-4 flex items-center justify-between border-b border-slate-800">
                    <div className="flex items-center gap-2.5">
                      <div className="w-8 h-8 rounded-full bg-amber-500 flex items-center justify-center font-bold text-slate-950 text-xs">
                        {combo.createdBy ? combo.createdBy.charAt(0) : '👤'}
                      </div>
                      <div>
                        <span className="font-bold text-xs text-white">{combo.createdBy}</span>
                        <span className="text-[10px] text-slate-500 block">added a combo 👀</span>
                      </div>
                    </div>
                    {combo.weirdnessScore >= 4 && (
                      <span className="text-[10px] bg-rose-500/20 text-rose-300 font-bold px-2 py-0.5 rounded-full">Cursed 💀</span>
                    )}
                  </div>

                  <div onClick={() => setSelectedComboId(combo.id)} className="aspect-[16/9] bg-slate-950 cursor-pointer relative group">
                    <img src={combo.imageUrl} alt={combo.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                    <div className="absolute bottom-3 left-3 right-3 text-white">
                      <h3 className="text-xl font-black drop-shadow-md">{combo.title}</h3>
                    </div>
                  </div>

                  <div className="p-4 flex items-center justify-between">
                    <div className="flex gap-4 text-xs font-bold">
                      <button onClick={() => toggleFavorite(combo.id)} className={`flex items-center gap-1 ${isFav ? 'text-rose-400' : 'text-slate-300'}`}>
                        <Icons.Heart size={15} fill={isFav ? 'currentColor' : 'none'} />
                        <span>{isFav ? 'Liked' : 'Like'}</span>
                      </button>
                      <button onClick={() => setSelectedComboId(combo.id)} className="flex items-center gap-1 text-slate-300">
                        <Icons.Star size={15} className="text-amber-400" />
                        <span>{combo.ratingAvg}★</span>
                      </button>
                      <button onClick={() => setSelectedComboId(combo.id)} className="flex items-center gap-1 text-slate-300">
                        <Icons.MessageCircle size={15} />
                        <span>{comboComments.length}</span>
                      </button>
                    </div>
                    <button onClick={() => setSelectedComboId(combo.id)} className="text-xs font-bold text-orange-400">
                      Details →
                    </button>
                  </div>
                </article>
              );
            })}
          </div>
        </div>
      );
    }

    // --- MAIN APP ---
    function App() {
      const { currentTab, setCurrentTab, selectedComboId, isAddModalOpen, isProfileModalOpen } = useApp();

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
          <Navbar />
          <main className="flex-1">
            {currentTab === 'explore' && <ExploreView />}
            {currentTab === 'search' && <SearchDiscoverView />}
            {currentTab === 'duel' && (
              <div className="max-w-3xl mx-auto px-4 py-8">
                <NormalOrCursedDuel isStandalone={true} />
              </div>
            )}
            {currentTab === 'feed' && <CommunityFeedView />}
          </main>

          {selectedComboId && <ComboDetailModal />}
          {isAddModalOpen && <AddComboModal />}
          {isProfileModalOpen && <ProfileModal />}
          <ToastContainer />

          <footer className="border-t border-slate-800 py-8 text-center text-xs text-slate-500 mt-12 space-y-2">
            <div className="font-bold text-slate-400">ComboBite 🍌 | Normal or Cursed?</div>
            <p>Celebrating Kerala comfort foods and chaotic late-night culinary experiments.</p>
          </footer>
        </div>
      );
    }

    // Mount
    ReactDOM.createRoot(document.getElementById('root')).render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>
</body>
</html>
